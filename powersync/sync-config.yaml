# Sync Streams — qué replica PowerSync a cada dispositivo.
#
# Un stream por tabla, todos con auto_subscribe: el dispositivo baja el dataset
# completo apenas conecta, sin que la app tenga que suscribirse a nada. Es lo
# que pide CLAUDE.md §6 y lo correcto para este perfil de uso: ~500 madres,
# cinco dispositivos, y una app que tiene que funcionar días enteros sin señal.
# Sincronizar parcialmente agregaría complejidad sin resolver ningún problema
# real, y rompería el trabajo offline.
#
# Ojo: esto NO es control de acceso. Acá no hay recorte por usuario porque
# todos ven todo. La seguridad de las ESCRITURAS la hace RLS cuando la cola de
# subida las manda por PostgREST con el JWT de cada operador.

config:
  edition: 3

streams:
  ovejas:
    auto_subscribe: true
    query: SELECT * FROM ovejas

  partos:
    auto_subscribe: true
    query: SELECT * FROM partos

  corderos:
    auto_subscribe: true
    query: SELECT * FROM corderos

  # PowerSync exige que la clave primaria de cada tabla sincronizada se llame
  # `id`. En `perfiles` la PK real es `user_id` (apunta a auth.users), así que
  # se renombra acá en vez de deformar el esquema del servidor.
  perfiles:
    auto_subscribe: true
    query: SELECT user_id as id, nombre, rol, activo FROM perfiles
