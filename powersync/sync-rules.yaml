# Sync Rules — qué replica PowerSync a cada dispositivo.
#
# Un único bucket global, sin parámetros: todos los dispositivos reciben el
# dataset completo. Es lo que pide CLAUDE.md §6 y lo correcto para este perfil
# de uso — miles de filas, cinco dispositivos, y una app que tiene que
# funcionar días enteros sin señal. Particionar por dispositivo o por temporada
# agregaría complejidad sin resolver ningún problema real.
#
# Ojo: esto NO es control de acceso. El recorte por usuario no existe acá
# porque no hace falta (todos ven todo), y la seguridad de las ESCRITURAS la
# hace RLS cuando la cola de subida las manda por PostgREST.

bucket_definitions:
  global:
    data:
      - SELECT * FROM ovejas
      - SELECT * FROM partos
      - SELECT * FROM corderos

      # PowerSync exige que la clave primaria de cada tabla sincronizada se
      # llame `id`. En `perfiles` la PK es `user_id` (apunta a auth.users), así
      # que se renombra acá en vez de deformar el esquema del servidor.
      - SELECT user_id as id, nombre, rol, activo FROM perfiles
